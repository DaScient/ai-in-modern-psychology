name: Test Notebooks

on:
  push:
    paths:
      - "notebooks/**"
      - "code/**"
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday
  workflow_dispatch:

jobs:
  test-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert numpy pandas scikit-learn matplotlib seaborn xgboost shap
      - name: Execute notebooks
        run: |
          for nb in notebooks/*.ipynb; do
            echo "Executing $nb"
            jupyter nbconvert --to notebook --execute "$nb" \
              --output "/tmp/$(basename $nb)" \
              --ExecutePreprocessor.timeout=300 || echo "Failed: $nb"
          done
